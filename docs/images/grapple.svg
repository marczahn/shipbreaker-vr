<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="864" viewBox="0 0 1200 864" role="img" aria-label="ShipbreakerVR grapple and tethers"><rect width="1200" height="864" rx="12" fill="#11151b"/><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker></defs><text x="40" y="52" font-size="26" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Grapple and tethers</text><text x="40" y="78" font-size="14" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">B switches the grapple between grappling and placing tethers. Two buzzes: tether mode, one buzz: grappling.</text><text x="40" y="128" font-size="16" fill="#8cf2ff" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Grappling</text><text x="630" y="128" font-size="16" fill="#ff9926" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Placing tethers</text><rect x="40" y="144" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,166)"><rect x="11" y="22" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(55 26 46)"/><path d="M40 40 L74 18" stroke="#8cf2ff" stroke-width="3"/></g><text x="150" y="186" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Light blue laser</text><text x="150" y="212" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The grapple grapples.</text><text x="150" y="232" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">As in the flat game.</text><rect x="630" y="144" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,166)"><rect x="11" y="22" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(55 26 46)"/><path d="M40 40 L74 18" stroke="#8cf2ff" stroke-width="3"/><circle cx="70" cy="21" r="7" fill="none" stroke="#ff9926" stroke-width="3"/></g><text x="740" y="186" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Light blue laser with an orange ring</text><text x="740" y="212" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The grapple places tethers.</text><text x="740" y="232" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The ring marks where the tether would hold.</text><rect x="40" y="284" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,306)"><rect x="23" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(0 38 38)"/><path d="M30 30 Q22 38 30 48" stroke="#f0883e" stroke-width="4" fill="none"/><path d="M10 39 H22" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/></g><text x="150" y="326" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Grapple</text><text x="150" y="352" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Trigger: grapple, hold to keep hold.</text><text x="150" y="372" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Trigger held + A throws, trigger held + B reels in.</text><rect x="630" y="284" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,306)"><rect x="23" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(0 38 38)"/><path d="M30 30 Q22 38 30 48" stroke="#f0883e" stroke-width="4" fill="none"/><path d="M10 39 H22" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/></g><text x="740" y="326" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Place a tether</text><text x="740" y="352" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Trigger at the start, let go at the end.</text><text x="740" y="372" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">A line shows the tether while the trigger is held.</text><rect x="40" y="424" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,446)"><rect x="11" y="22" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(55 26 46)"/><path d="M40 40 L74 18" stroke="#8cf2ff" stroke-width="3"/><circle cx="72" cy="19" r="7" fill="#8cf2ff" opacity="0.5"/><circle cx="72" cy="19" r="3" fill="#ffffff"/></g><text x="150" y="466" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Bright dot</text><text x="150" y="492" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Marks where the laser hits.</text><text x="150" y="512" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The cutter&#x27;s laser has one too.</text><rect x="630" y="424" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,446)"><rect x="2" y="8" width="16" height="26" rx="3" fill="#3a4554"/><rect x="58" y="42" width="16" height="26" rx="3" fill="#3a4554"/><path d="M18 22 L58 54" stroke="#ff9926" stroke-width="5"/><circle cx="18" cy="22" r="4" fill="#ff9926"/><circle cx="58" cy="54" r="4" fill="#ff9926"/></g><text x="740" y="466" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Remove one tether</text><text x="740" y="492" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Point at it (it lights up orange) and tap A.</text><text x="740" y="512" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Pointing at no tether, A uses what you point at.</text><rect x="40" y="564" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,586)"><circle cx="38" cy="38" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="38" y="44.42857142857143" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">B</text></g><text x="150" y="606" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Tether mode</text><text x="150" y="632" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">B: switch to the tether mode.</text><text x="150" y="652" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">However long you press it.</text><rect x="630" y="564" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,586)"><circle cx="38" cy="38" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="38" y="44.42857142857143" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">A</text></g><text x="740" y="606" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Recall all tethers</text><text x="740" y="632" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Hold A.</text><text x="740" y="652" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">B switches back to grappling, however long you hold it.</text><rect x="40" y="704" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,726)"><circle cx="38" cy="38" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="38" y="44.42857142857143" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">A</text></g><text x="150" y="746" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Push</text><text x="150" y="772" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Nothing held: A pushes, also at consoles.</text><text x="150" y="792" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Hold A to charge. It goes where the grapple points.</text></svg>
