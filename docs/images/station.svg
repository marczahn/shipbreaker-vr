<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-label="ShipbreakerVR walking in the station"><rect width="1200" height="550" rx="12" fill="#11151b"/><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker></defs><text x="40" y="52" font-size="26" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Walking in the station</text><text x="40" y="78" font-size="14" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">VR tab: Walk in the station, off by default. Without it the game&#x27;s prompts show the way.</text><rect x="40" y="110" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,132)"><circle cx="38" cy="38" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="38" y="44.42857142857143" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">A</text></g><text x="150" y="152" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Stand up</text><text x="150" y="178" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Walking on: sitting on the bed, A stands up.</text><text x="150" y="198" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">There is no way back to the bed.</text><rect x="630" y="110" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,132)"><circle cx="38" cy="38" r="30" fill="#2f3945" stroke="#f0883e" stroke-width="2"/><circle cx="38" cy="38" r="12" fill="#3a4554"/><path d="M14 38 H2" stroke="#f0883e" stroke-width="3" fill="none" marker-end="url(#ah)"/><path d="M62 38 H74" stroke="#f0883e" stroke-width="3" fill="none" marker-end="url(#ah)"/><path d="M38 14 V2" stroke="#f0883e" stroke-width="3" fill="none" marker-end="url(#ah)"/><path d="M38 62 V74" stroke="#f0883e" stroke-width="3" fill="none" marker-end="url(#ah)"/></g><text x="740" y="152" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Walk</text><text x="740" y="178" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Left stick, where you look.</text><text x="740" y="198" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">You slide along the edges. Can make you feel sick.</text><rect x="40" y="250" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,272)"><circle cx="38" cy="38" r="30" fill="#2f3945" stroke="#f0883e" stroke-width="2"/><circle cx="38" cy="38" r="12" fill="#3a4554"/><path d="M14 38 H2" stroke="#f0883e" stroke-width="3" fill="none" marker-end="url(#ah)"/><path d="M62 38 H74" stroke="#f0883e" stroke-width="3" fill="none" marker-end="url(#ah)"/></g><text x="150" y="292" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Turn</text><text x="150" y="318" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Right stick: steps of 45°.</text><text x="150" y="338" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Your head moves freely.</text><rect x="630" y="250" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,272)"><circle cx="38" cy="38" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="38" y="44.42857142857143" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">A</text></g><text x="740" y="292" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Screens and exit</text><text x="740" y="318" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Near one and looking at it: A uses it.</text><text x="740" y="338" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">B leaves it as usual. You stay where you stand.</text><rect x="40" y="390" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,412)"><circle cx="38" cy="38" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="38" y="44.42857142857143" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">X</text></g><text x="150" y="432" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Exit from anywhere</text><text x="150" y="458" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">X opens the exit&#x27;s menu.</text><text x="150" y="478" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">It steps you a meter back from the door if needed.</text><rect x="630" y="390" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,412)"><rect x="23" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(0 38 38)"/><path d="M30 30 Q22 38 30 48" stroke="#f0883e" stroke-width="4" fill="none"/><path d="M10 39 H22" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/></g><text x="740" y="432" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Posters</text><text x="740" y="458" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Look at one from close by: triggers change it.</text><text x="740" y="478" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Own pictures: PNG or JPG in BepInEx/ShipbreakerVR-Poster.</text></svg>
