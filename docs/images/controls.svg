<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="ShipbreakerVR flying controls"><rect width="1200" height="800" rx="12" fill="#11151b"/><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker></defs><text x="40" y="52" font-size="26" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Flying in VR</text><text x="40" y="78" font-size="14" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Controller flying (VTOL). Everything is on the left hand; the right hand stays free.</text><rect x="40" y="110" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,132)"><rect x="20" y="22" width="30" height="44" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" opacity=".45"/><rect x="38" y="10" width="30" height="44" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2"/><path d="M30 60 L60 20" stroke="#f0883e" stroke-width="2.5" marker-end="url(#ah)"/></g><text x="150" y="152" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Thrust</text><text x="150" y="178" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Hold the left trigger and move the controller.</text><text x="150" y="198" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Thrust goes where you move it; farther = stronger.</text><rect x="610" y="110" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(630,132)"><rect x="24" y="14" width="30" height="50" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(-25 39 39)"/><path d="M8 20 A36 36 0 0 0 8 58" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/></g><text x="720" y="152" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Roll</text><text x="720" y="178" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Trigger held: tilt the controller sideways.</text><text x="720" y="198" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The farther you tilt, the faster you roll.</text><rect x="40" y="250" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,272)"><circle cx="38" cy="38" r="30" fill="#2f3945" stroke="#f0883e" stroke-width="2"/><circle cx="38" cy="38" r="12" fill="#3a4554"/><path d="M14 38 H2 M62 38 H74" stroke="#f0883e" stroke-width="3" marker-end="url(#ah)"/><path d="M14 38 L2 38" stroke="#f0883e" stroke-width="3" marker-end="url(#ah)"/></g><text x="150" y="292" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Turn</text><text x="150" y="318" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Left stick left / right.</text><text x="150" y="338" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Smooth or 30° / 45° / 90° steps (VR tab: Turning).</text><rect x="610" y="250" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(630,272)"><circle cx="38" cy="38" r="30" fill="#2f3945" stroke="#f0883e" stroke-width="2"/><circle cx="38" cy="38" r="12" fill="#3a4554"/><path d="M38 14 V2" stroke="#f0883e" stroke-width="3" marker-end="url(#ah)"/><path d="M38 62 V74" stroke="#f0883e" stroke-width="3" marker-end="url(#ah)"/></g><text x="720" y="292" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Pitch</text><text x="720" y="318" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Left stick up / down.</text><text x="720" y="338" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Stick up looks up, like the mouse.</text><rect x="40" y="390" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,412)"><circle cx="38" cy="38" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="38" y="45" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Y</text></g><text x="150" y="432" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Brake</text><text x="150" y="458" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Y on the left controller.</text><text x="150" y="478" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Uses the game&#x27;s own brake, fuel and HUD.</text><rect x="610" y="390" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(630,412)"><circle cx="18" cy="38" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="18" y="45" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">X</text><circle cx="60" cy="38" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="60" y="45" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">A</text><text x="39" y="44" font-size="16" fill="#8b949e" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">+</text></g><text x="720" y="432" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Pause</text><text x="720" y="458" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Press X and A together.</text><text x="720" y="478" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">On loading screens it shows the next tip.</text><rect x="40" y="540" width="1120" height="220" rx="12" fill="#1a2028" stroke="#2b333d"/><text x="64" y="574" font-size="18" fill="#58a6ff" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">In menus</text><text x="200" y="574" font-size="14" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">both controllers act as one Xbox gamepad, each button where its twin sits</text><text x="64" y="610" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Left stick</text><text x="234" y="610" font-size="14" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">navigate</text><text x="624" y="610" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Right stick</text><text x="794" y="610" font-size="14" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">scroll · press = R3</text><text x="64" y="640" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">A</text><text x="234" y="640" font-size="14" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">confirm</text><text x="624" y="640" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">B</text><text x="794" y="640" font-size="14" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">back</text><text x="64" y="670" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">X / Y</text><text x="234" y="670" font-size="14" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">X / Y</text><text x="624" y="670" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Triggers</text><text x="794" y="670" font-size="14" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">switch tabs</text><text x="64" y="700" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Grips</text><text x="234" y="700" font-size="14" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">gamepad triggers</text><text x="624" y="700" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Left menu button</text><text x="794" y="700" font-size="14" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Virtual Desktop</text><text x="64" y="742" font-size="13" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Keyboard:  F3 VR on/off  ·  F4 center view  ·  F7 monitor look  ·  F8 debug dump</text></svg>
