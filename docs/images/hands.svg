<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="ShipbreakerVR hands"><rect width="1200" height="720" rx="12" fill="#11151b"/><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker></defs><text x="40" y="52" font-size="26" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Your hands</text><text x="40" y="78" font-size="14" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Taking tools from the body and holding on. Either hand can do all of it.</text><rect x="40" y="110" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,132)"><rect x="23" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(0 38 38)"/><rect x="47" y="30" width="8" height="20" rx="3" fill="#f0883e"/><path d="M72 40 H60" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><path d="M4 40 H16" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/></g><text x="150" y="152" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Take a tool</text><text x="150" y="178" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Squeeze the grip at your body; it buzzes in a zone.</text><text x="150" y="198" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Keep squeezing to hold it, let go to put it away.</text><rect x="630" y="110" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,132)"><circle cx="38" cy="14" r="10" fill="#2f3945" stroke="#f0883e" stroke-width="2"/><rect x="24" y="26" width="28" height="36" rx="8" fill="#2f3945" stroke="#f0883e" stroke-width="2"/><circle cx="56" cy="20" r="4" fill="#f0883e"/><circle cx="58" cy="34" r="4" fill="#f0883e"/><circle cx="52" cy="58" r="4" fill="#f0883e"/><circle cx="24" cy="58" r="4" fill="#f0883e"/></g><text x="740" y="152" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Where the tools are</text><text x="740" y="178" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Right hip grapple · left hip demo charges</text><text x="740" y="198" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Over the right shoulder cutter · right side of the helmet scanner</text><rect x="40" y="250" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,272)"><rect x="9" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(-15 24 38)"/><rect x="37" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(15 52 38)"/></g><text x="150" y="292" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Two tools at once</text><text x="150" y="318" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Take a second tool with the other hand.</text><text x="150" y="338" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Cutter, grapple, demo charges; each hand works its own.</text><rect x="630" y="250" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,272)"><rect x="9" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(-15 24 38)"/><rect x="37" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(15 52 38)"/><path d="M24 8 Q38 -2 52 8" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/></g><text x="740" y="292" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Hand a tool over</text><text x="740" y="318" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Reach for the tool in one hand with the other one</text><text x="740" y="338" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">and squeeze the grip: that hand takes it over.</text><rect x="40" y="390" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,412)"><rect x="14" y="16" width="48" height="44" rx="10" fill="#2f3945" stroke="#f0883e" stroke-width="2"/><path d="M22 46 L32 32 L42 40 L54 24" stroke="#8cf2ff" stroke-width="2.5" fill="none"/></g><text x="150" y="432" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Scan</text><text x="150" y="458" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Take the scanner: the other hand&#x27;s tool hides.</text><text x="150" y="478" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Keep that hand&#x27;s grip squeezed and it comes back after the scan.</text><rect x="630" y="390" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,412)"><rect x="0" y="54" width="76" height="14" rx="3" fill="#3a4554"/><path d="M24 54 V30 Q24 18 36 18 Q48 18 48 30 V54" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><path d="M64 40 V8" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/></g><text x="740" y="432" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Hold on and climb</text><text x="740" y="458" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Grip with an empty hand close to anything holds on.</text><text x="740" y="478" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Move the hand to pull yourself; let go moving to push off.</text><rect x="40" y="530" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,552)"><rect x="8" y="10" width="42" height="56" rx="6" fill="#3a4554"/><rect x="16" y="20" width="26" height="16" rx="3" fill="#2f3945" stroke="#f0883e" stroke-width="2"/><path d="M74 50 H52" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/></g><text x="150" y="572" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Consoles and switches</text><text x="150" y="598" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Look at it and press A or X.</text><text x="150" y="618" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The grip only holds on there.</text><rect x="630" y="530" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,552)"><circle cx="22" cy="44" r="15" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="22" y="50" font-size="15" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">X</text><circle cx="54" cy="28" r="15" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="54" y="34" font-size="15" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Y</text></g><text x="740" y="572" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Left hand</text><text x="740" y="598" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">A tool in the left hand: X works as A, Y as B.</text><text x="740" y="618" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Flying pauses until you let go; the right stick still turns.</text><text x="40" y="692" font-size="14" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The suit&#x27;s hands follow your controllers and close with the grip.</text></svg>
