<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-label="ShipbreakerVR flying controls"><rect width="1200" height="830" rx="12" fill="#11151b"/><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker></defs><text x="40" y="52" font-size="26" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Flying in VR</text><text x="40" y="78" font-size="14" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Controller flying (VR tab: Controller flying). Left hand: thrust, roll and brake. Right stick: turn and pitch.</text><rect x="40" y="110" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,132)"><rect x="15" y="22" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(0 30 46)" opacity=".45"/><rect x="31" y="8" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(0 46 32)"/><path d="M24 60 L56 22" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/></g><text x="150" y="152" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Thrust</text><text x="150" y="178" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Hold the left trigger and move the controller.</text><text x="150" y="198" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Thrust goes where you move it; farther = stronger.</text><rect x="630" y="110" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,132)"><rect x="23" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(-25 38 38)"/><path d="M8 20 A36 36 0 0 0 8 58" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/></g><text x="740" y="152" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Roll</text><text x="740" y="178" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Trigger held: tilt the controller sideways.</text><text x="740" y="198" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">From 12° on, faster up to 90°. Tilting alone gives no thrust.</text><rect x="40" y="250" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,272)"><circle cx="38" cy="38" r="30" fill="#2f3945" stroke="#f0883e" stroke-width="2"/><circle cx="38" cy="38" r="12" fill="#3a4554"/><path d="M14 38 H2" stroke="#f0883e" stroke-width="3" fill="none" marker-end="url(#ah)"/><path d="M62 38 H74" stroke="#f0883e" stroke-width="3" fill="none" marker-end="url(#ah)"/></g><text x="150" y="292" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Turn</text><text x="150" y="318" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Right stick left / right.</text><text x="150" y="338" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Smooth or 30° / 45° / 90° steps (VR tab: Turning).</text><rect x="630" y="250" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,272)"><circle cx="38" cy="38" r="30" fill="#2f3945" stroke="#f0883e" stroke-width="2"/><circle cx="38" cy="38" r="12" fill="#3a4554"/><path d="M38 14 V2" stroke="#f0883e" stroke-width="3" fill="none" marker-end="url(#ah)"/><path d="M38 62 V74" stroke="#f0883e" stroke-width="3" fill="none" marker-end="url(#ah)"/></g><text x="740" y="292" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Pitch</text><text x="740" y="318" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Right stick up / down.</text><text x="740" y="338" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Stick up looks up, like the mouse.</text><rect x="40" y="390" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,412)"><circle cx="38" cy="38" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="38" y="44.42857142857143" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Y</text></g><text x="150" y="432" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Brake</text><text x="150" y="458" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Y on the left controller.</text><text x="150" y="478" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Uses the game&#x27;s own brake, fuel and HUD.</text><rect x="630" y="390" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,412)"><circle cx="38" cy="38" r="26" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><circle cx="38" cy="38" r="16" fill="#3a4554"/><text x="38" y="44" font-size="15" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">R3</text></g><text x="740" y="432" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Pause</text><text x="740" y="458" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Press the right stick (also in the station).</text><text x="740" y="478" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">On loading screens it shows the next tip.</text><rect x="40" y="530" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,552)"><circle cx="38" cy="38" r="26" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><circle cx="38" cy="38" r="16" fill="#3a4554"/><text x="38" y="44" font-size="15" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">L3</text></g><text x="150" y="572" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Center the view</text><text x="150" y="598" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Press the left stick, or F4 on the keyboard.</text><text x="150" y="618" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Puts the view and the menus in front of you again.</text><rect x="630" y="530" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,552)"><circle cx="38" cy="38" r="26" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><circle cx="38" cy="38" r="16" fill="#3a4554"/><text x="38" y="44" font-size="15" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">L3</text></g><text x="740" y="572" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Get upright</text><text x="740" y="598" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Hold the left stick in for half a second.</text><text x="740" y="618" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Back to level, keeping your heading.</text><rect x="40" y="670" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,692)"><rect x="23" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(0 38 38)"/><path d="M30 30 Q22 38 30 48" stroke="#f0883e" stroke-width="4" fill="none"/><path d="M10 39 H22" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/></g><text x="150" y="712" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Simple thrust</text><text x="150" y="738" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">VR tab: Simple thrust. Let go of the trigger to stop.</text><text x="150" y="758" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">You brake by yourself, at a third of the brake&#x27;s strength.</text><rect x="630" y="670" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,692)"><rect x="0" y="54" width="76" height="14" rx="3" fill="#3a4554"/><path d="M24 54 V30 Q24 18 36 18 Q48 18 48 30 V54" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><path d="M64 40 V8" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/></g><text x="740" y="712" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Grapple holds something big</text><text x="740" y="738" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Fly and brake as usual.</text><text x="740" y="758" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Fly farther than the grapple reaches and the rope snaps.</text></svg>
