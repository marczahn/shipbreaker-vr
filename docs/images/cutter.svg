<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-label="ShipbreakerVR cutter"><rect width="1200" height="550" rx="12" fill="#11151b"/><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker></defs><text x="40" y="52" font-size="26" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Cutter</text><text x="40" y="78" font-size="14" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Over the right shoulder. B switches between the Splitsaw (a line) and the Stinger (a point).</text><rect x="40" y="110" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,132)"><rect x="14" y="14" width="48" height="48" rx="6" fill="#3a4554"/><path d="M6 38 H70" stroke="#8cf2ff" stroke-width="3" stroke-dasharray="6 4"/></g><text x="150" y="152" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Splitsaw</text><text x="150" y="178" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Trigger: cut along the line.</text><text x="150" y="198" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Dots on the parts show where it cuts. Horizontal at first.</text><rect x="630" y="110" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,132)"><circle cx="38" cy="38" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="38" y="44.42857142857143" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">A</text></g><text x="740" y="152" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Turn the cut</text><text x="740" y="178" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">A: switch between horizontal and vertical cuts.</text><text x="740" y="198" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The line also turns with your wrist.</text><rect x="40" y="250" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,272)"><rect x="14" y="14" width="48" height="48" rx="6" fill="#3a4554"/><circle cx="38" cy="38" r="8" fill="none" stroke="#8cf2ff" stroke-width="3"/><circle cx="38" cy="38" r="2.5" fill="#8cf2ff"/></g><text x="150" y="292" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Stinger</text><text x="150" y="318" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">B: switch to the Stinger, B again: back.</text><text x="150" y="338" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Trigger: cut the point the laser shows.</text><rect x="630" y="250" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,272)"><rect x="10" y="30" width="56" height="16" rx="5" fill="#3a4554"/><rect x="12" y="32" width="36" height="12" rx="4" fill="#f0883e"/><rect x="48" y="32" width="16" height="12" rx="4" fill="#d1453b"/></g><text x="740" y="292" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Heat</text><text x="740" y="318" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The cutter heats up while it cuts.</text><text x="740" y="338" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The heat bar shows it; let go before it overheats.</text><rect x="40" y="390" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,412)"><rect x="9" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(-15 24 38)"/><rect x="37" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(15 52 38)"/></g><text x="150" y="432" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Cutter and grapple</text><text x="150" y="458" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Hold the grapple in the other hand.</text><text x="150" y="478" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Each hand&#x27;s trigger and buttons work its own tool.</text><rect x="630" y="390" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,412)"><rect x="23" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(0 38 38)"/><rect x="47" y="30" width="8" height="20" rx="3" fill="#f0883e"/><path d="M72 40 H60" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><path d="M4 40 H16" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/></g><text x="740" y="432" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Fit it into the hand</text><text x="740" y="458" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">VR tab: Fit tools in the hand.</text><text x="740" y="478" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The other hand&#x27;s grip moves it; switch the row off when done.</text></svg>
