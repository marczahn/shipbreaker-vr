<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="ShipbreakerVR tool controls"><rect width="1200" height="800" rx="12" fill="#11151b"/><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker></defs><text x="40" y="52" font-size="26" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Tools in VR</text><text x="40" y="78" font-size="14" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Aim with the hand (VR tab: Aim with the hand). The buttons are on the controller of the hand that holds the tool.</text><rect x="40" y="110" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><rect x="80" y="140" width="34" height="60" rx="14" fill="#2f3945" stroke="#f0883e" stroke-width="2"/><path d="M134 170 H118" stroke="#f0883e" stroke-width="3" marker-end="url(#ah)"/><path d="M60 170 H76" stroke="#f0883e" stroke-width="3" marker-end="url(#ah)"/><text x="150" y="152" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Take a tool</text><text x="150" y="178" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Squeeze the grip at your body; it buzzes in a zone.</text><text x="150" y="198" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Keep squeezing to hold it, let go to put it away.</text><rect x="610" y="110" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><rect x="634" y="176" width="26" height="18" rx="6" fill="#2f3945" stroke="#f0883e" stroke-width="2"/><path d="M660 182 L700 150" stroke="#8fe9ff" stroke-width="2"/><circle cx="700" cy="150" r="6" fill="#8fe9ff"/><circle cx="700" cy="150" r="2.5" fill="#ffffff"/><text x="720" y="152" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Aim</text><text x="720" y="178" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Point the controller. A laser shows where.</text><text x="720" y="198" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Its color is the game's crosshair: in range, cooling down.</text><rect x="40" y="250" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><path d="M70 280 Q100 276 104 302 L104 338 Q88 342 80 328 Z" fill="#2f3945" stroke="#f0883e" stroke-width="2"/><path d="M130 302 H112" stroke="#f0883e" stroke-width="3" marker-end="url(#ah)"/><text x="150" y="292" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Fire</text><text x="150" y="318" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Trigger: cut, grapple, place or detonate demo charges.</text><text x="150" y="338" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Trigger held + B: reel in what the grapple holds.</text><rect x="610" y="250" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><circle cx="668" cy="310" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="668" y="317" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">A</text><text x="720" y="292" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Use and throw</text><text x="720" y="318" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">A: use what you point at.</text><text x="720" y="338" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Trigger held + A: throw.</text><rect x="40" y="390" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><circle cx="98" cy="450" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="98" y="457" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">B</text><text x="150" y="432" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Mode and tethers</text><text x="150" y="458" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">B: switch the tool's mode (demo charges: detonator).</text><text x="150" y="478" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Hold B: tether from where you point to where you let go.</text><rect x="610" y="390" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><circle cx="668" cy="450" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="668" y="457" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">B</text><text x="720" y="432" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Recall tethers</text><text x="720" y="458" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Hold B while pointing at nothing.</text><text x="720" y="478" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">All placed tethers come back.</text><rect x="40" y="530" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><circle cx="78" cy="590" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="78" y="597" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">X</text><circle cx="120" cy="590" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="120" y="597" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Y</text><text x="150" y="572" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Left hand</text><text x="150" y="598" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Take a tool with the left hand: X works as A, Y as B.</text><text x="150" y="618" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Flying pauses until you let go; the right stick still turns.</text><rect x="610" y="530" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><rect x="650" y="560" width="34" height="60" rx="14" fill="#2f3945" stroke="#f0883e" stroke-width="2"/><path d="M704 590 H688" stroke="#f0883e" stroke-width="3" marker-end="url(#ah)"/><path d="M630 590 H646" stroke="#f0883e" stroke-width="3" marker-end="url(#ah)"/><text x="720" y="572" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Other hand</text><text x="720" y="598" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Reach for the tool in one hand with the other one</text><text x="720" y="618" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">and squeeze the grip: that hand takes it over.</text><rect x="40" y="680" width="1120" height="90" rx="12" fill="#1a2028" stroke="#2b333d"/><text x="64" y="714" font-size="18" fill="#58a6ff" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Where the tools are</text><text x="270" y="714" font-size="14" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Right hip: grapple   ·   Left hip: demo charges   ·   Over the right shoulder: cutter   ·   Right side of the helmet: scanner</text><text x="64" y="746" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Either hand can take any tool. One tool at a time; the suit's hands follow your controllers and close with the grip.</text></svg>