<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-label="ShipbreakerVR tool buttons"><rect width="1200" height="830" rx="12" fill="#11151b"/><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker></defs><text x="40" y="52" font-size="26" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Tool buttons</text><text x="40" y="78" font-size="14" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Aim with the hand (VR tab: Aim with the hand). The buttons are on the controller of the hand that holds the tool.</text><rect x="40" y="110" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,132)"><rect x="11" y="22" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(55 26 46)"/><path d="M40 40 L74 18" stroke="#8cf2ff" stroke-width="3"/></g><text x="150" y="152" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Aim</text><text x="150" y="178" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Point the controller. Cutter red, grapple light blue.</text><text x="150" y="198" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Demo charges and an empty hand have no laser.</text><rect x="630" y="110" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,132)"><rect x="23" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(0 38 38)"/><path d="M30 30 Q22 38 30 48" stroke="#f0883e" stroke-width="4" fill="none"/><path d="M10 39 H22" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/></g><text x="740" y="152" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Use the tool</text><text x="740" y="178" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Trigger: cut, grapple, place or detonate demo charges.</text><text x="740" y="198" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Hold the trigger to keep hold with the grapple.</text><rect x="40" y="250" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,272)"><circle cx="38" cy="38" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="38" y="44.42857142857143" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">A</text></g><text x="150" y="292" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Use</text><text x="150" y="318" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">A: use what you point at, with either hand.</text><text x="150" y="338" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">On the cutter A turns the cut; the grapple pushes instead.</text><rect x="630" y="250" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,272)"><rect x="23" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(0 38 38)"/><path d="M30 30 Q22 38 30 48" stroke="#f0883e" stroke-width="4" fill="none"/><path d="M10 39 H22" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><circle cx="62" cy="14" r="13" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="62" y="19" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">A</text></g><text x="740" y="292" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Throw</text><text x="740" y="318" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Trigger held + A: throw what the grapple holds.</text><text x="740" y="338" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Hold A to charge, let go to throw.</text><rect x="40" y="390" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,412)"><circle cx="38" cy="38" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="38" y="44.42857142857143" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">A</text></g><text x="150" y="432" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Push</text><text x="150" y="458" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Grapple holding nothing: A pushes things away.</text><text x="150" y="478" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Hold A to charge. It goes where the grapple points.</text><rect x="630" y="390" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,412)"><circle cx="38" cy="38" r="20" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="38" y="44.42857142857143" font-size="18" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">B</text></g><text x="740" y="432" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Tool mode</text><text x="740" y="458" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">B: switch the tool&#x27;s mode.</text><text x="740" y="478" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Demo charges: detonator. Grapple: tethers (see below).</text><rect x="40" y="530" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,552)"><rect x="23" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(0 38 38)"/><path d="M30 30 Q22 38 30 48" stroke="#f0883e" stroke-width="4" fill="none"/><path d="M10 39 H22" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><circle cx="62" cy="14" r="13" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="62" y="19" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">B</text></g><text x="150" y="572" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Reel in</text><text x="150" y="598" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Trigger held + B: reel in what the grapple holds.</text><text x="150" y="618" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">While B is held.</text><rect x="630" y="530" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,552)"><rect x="23" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(0 38 38)"/><path d="M10 20 A34 34 0 0 1 66 20" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><path d="M22 64 H54" stroke="#8cf2ff" stroke-width="3"/></g><text x="740" y="572" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Turn the cutter&#x27;s line</text><text x="740" y="598" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">A: horizontal or vertical cuts.</text><text x="740" y="618" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Rolling your wrist turns the line too.</text><rect x="40" y="670" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,692)"><circle cx="22" cy="44" r="15" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="22" y="50" font-size="15" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">X</text><circle cx="54" cy="28" r="15" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="54" y="34" font-size="15" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Y</text></g><text x="150" y="712" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Left hand</text><text x="150" y="738" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">X works as A, Y as B.</text><text x="150" y="758" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Flying pauses while the left hand holds a tool.</text></svg>
