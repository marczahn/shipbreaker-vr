<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-label="ShipbreakerVR tools on the suit"><rect width="1200" height="850" rx="12" fill="#11151b"/><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker></defs><text x="40" y="52" font-size="26" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Tools on your suit</text><text x="40" y="78" font-size="14" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Seen from behind, so your left is on the left. Reach to a place and squeeze the grip; a short buzz tells you the hand is there.</text><path d="M566 520 L558 640 L552 745" stroke="#5b6b7f" stroke-width="55" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M566 520 L558 640 L552 745" stroke="#2f3945" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M634 520 L642 640 L648 745" stroke="#5b6b7f" stroke-width="55" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M634 520 L642 640 L648 745" stroke="#2f3945" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="522" y="738" width="62" height="34" rx="12" fill="#2f3945" stroke="#5b6b7f" stroke-width="2.5"/><rect x="616" y="738" width="62" height="34" rx="12" fill="#2f3945" stroke="#5b6b7f" stroke-width="2.5"/><path d="M503 288 L452 400 L436 500" stroke="#5b6b7f" stroke-width="39" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M503 288 L452 400 L436 500" stroke="#2f3945" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M697 288 L748 400 L764 500" stroke="#5b6b7f" stroke-width="39" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M697 288 L748 400 L764 500" stroke="#2f3945" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="434" cy="518" r="19" fill="#2f3945" stroke="#5b6b7f" stroke-width="2.5"/><circle cx="766" cy="518" r="19" fill="#2f3945" stroke="#5b6b7f" stroke-width="2.5"/><path d="M520 258 Q600 238 680 258 Q702 263 703 292 L687 440 Q685 470 691 500 L691 528 L509 528 L509 500 Q515 470 513 440 L497 292 Q498 263 520 258 Z" fill="#2f3945" stroke="#5b6b7f" stroke-width="2.5"/><rect x="511" y="476" width="178" height="16" rx="5" fill="#3a4554" stroke="#5b6b7f" stroke-width="1.5"/><ellipse cx="600" cy="244" rx="40" ry="11" fill="#3a4554" stroke="#5b6b7f" stroke-width="2"/><circle cx="600" cy="186" r="54" fill="#2f3945" stroke="#5b6b7f" stroke-width="2.5"/><path d="M566 150 Q600 128 634 150" stroke="#3a4554" stroke-width="5" stroke-linecap="round" fill="none"/><g transform="rotate(24 620 318)"><rect x="609" y="233" width="22" height="170" rx="8" fill="#3a4554" stroke="#f0883e" stroke-width="2"/><rect x="609" y="233" width="22" height="52" rx="8" fill="#f0883e" fill-opacity=".55" stroke="#f0883e" stroke-width="2"/></g><polygon points="626.4,448.0 615.0,459.4 599.0,459.4 587.6,448.0 587.6,432.0 599.0,420.6 615.0,420.6 626.4,432.0" fill="#3a4554" stroke="#f0883e" stroke-width="2" opacity=".6"/><polygon points="616.4,454.0 605.0,465.4 589.0,465.4 577.6,454.0 577.6,438.0 589.0,426.6 605.0,426.6 616.4,438.0" fill="#3a4554" stroke="#f0883e" stroke-width="2"/><path d="M583 446 H611" stroke="#f0883e" stroke-width="2.5"/><rect x="701" y="482" width="26" height="40" rx="7" fill="#3a4554" stroke="#f0883e" stroke-width="2"/><rect x="708" y="520" width="12" height="20" rx="3" fill="#3a4554" stroke="#f0883e" stroke-width="2"/><rect x="476" y="488" width="20" height="38" rx="6" fill="#3a4554" stroke="#f0883e" stroke-width="2"/><circle cx="486" cy="486" r="5.5" fill="#f0883e"/><ellipse cx="524" cy="182" rx="27" ry="27" fill="#f0883e" fill-opacity=".10" stroke="#f0883e" stroke-width="2" stroke-dasharray="6 5"/><ellipse cx="676" cy="182" rx="27" ry="27" fill="#f0883e" fill-opacity=".10" stroke="#f0883e" stroke-width="2" stroke-dasharray="6 5"/><ellipse cx="538" cy="252" rx="30" ry="30" fill="#f0883e" fill-opacity=".10" stroke="#f0883e" stroke-width="2" stroke-dasharray="6 5"/><ellipse cx="657" cy="240" rx="30" ry="30" fill="#f0883e" fill-opacity=".10" stroke="#f0883e" stroke-width="2" stroke-dasharray="6 5"/><ellipse cx="600" cy="444" rx="62" ry="36" fill="#f0883e" fill-opacity=".10" stroke="#f0883e" stroke-width="2" stroke-dasharray="6 5"/><ellipse cx="486" cy="506" rx="36" ry="36" fill="#f0883e" fill-opacity=".10" stroke="#f0883e" stroke-width="2" stroke-dasharray="6 5"/><ellipse cx="714" cy="508" rx="36" ry="36" fill="#f0883e" fill-opacity=".10" stroke="#f0883e" stroke-width="2" stroke-dasharray="6 5"/><path d="M538 238 V264" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><path d="M370 158.0 L524 182" stroke="#f0883e" stroke-width="1.6" stroke-opacity=".75" fill="none"/><circle cx="524" cy="182" r="4.5" fill="#f0883e"/><rect x="40" y="110" width="330" height="96" rx="12" fill="#1a2028" stroke="#2b333d"/><text x="60" y="144" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Flashlight</text><text x="60" y="168" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Left of the helmet.</text><text x="60" y="188" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Squeeze the grip: on or off.</text><path d="M370 274.0 L511 246" stroke="#f0883e" stroke-width="1.6" stroke-opacity=".75" fill="none"/><circle cx="511" cy="246" r="4.5" fill="#f0883e"/><rect x="40" y="226" width="330" height="96" rx="12" fill="#1a2028" stroke="#2b333d"/><text x="60" y="260" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Backpack</text><text x="60" y="284" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Behind the left shoulder.</text><text x="60" y="304" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Let go of a part there: it is collected.</text><path d="M370 488.0 L486 506" stroke="#f0883e" stroke-width="1.6" stroke-opacity=".75" fill="none"/><circle cx="486" cy="506" r="4.5" fill="#f0883e"/><rect x="40" y="440" width="330" height="96" rx="12" fill="#1a2028" stroke="#2b333d"/><text x="60" y="474" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Detonator</text><text x="60" y="498" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Left hip, on the belt.</text><text x="60" y="518" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Trigger: blows all placed charges.</text><path d="M370 644.0 L452 644 L600 462" stroke="#f0883e" stroke-width="1.6" stroke-opacity=".75" fill="none"/><circle cx="600" cy="462" r="4.5" fill="#f0883e"/><rect x="40" y="596" width="330" height="96" rx="12" fill="#1a2028" stroke="#2b333d"/><text x="60" y="630" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Demo charges</text><text x="60" y="654" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Behind the lower back, either hand.</text><text x="60" y="674" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">One charge comes into the hand.</text><path d="M830 158.0 L676 182" stroke="#f0883e" stroke-width="1.6" stroke-opacity=".75" fill="none"/><circle cx="676" cy="182" r="4.5" fill="#f0883e"/><rect x="830" y="110" width="330" height="96" rx="12" fill="#1a2028" stroke="#2b333d"/><text x="850" y="144" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Scanner</text><text x="850" y="168" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Right of the helmet.</text><text x="850" y="188" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Scans while you hold the grip.</text><path d="M830 274.0 L657 240" stroke="#f0883e" stroke-width="1.6" stroke-opacity=".75" fill="none"/><circle cx="657" cy="240" r="4.5" fill="#f0883e"/><rect x="830" y="226" width="330" height="96" rx="12" fill="#1a2028" stroke="#2b333d"/><text x="850" y="260" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Cutter</text><text x="850" y="284" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Over the right shoulder.</text><text x="850" y="304" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Reach back and squeeze the grip.</text><path d="M830 488.0 L714 508" stroke="#f0883e" stroke-width="1.6" stroke-opacity=".75" fill="none"/><circle cx="714" cy="508" r="4.5" fill="#f0883e"/><rect x="830" y="440" width="330" height="96" rx="12" fill="#1a2028" stroke="#2b333d"/><text x="850" y="474" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Grapple</text><text x="850" y="498" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Right hip, on the belt.</text><text x="850" y="518" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Slightly in front, so you can see it.</text><rect x="830" y="596" width="330" height="96" rx="12" fill="#1a2028" stroke="#2b333d"/><text x="850" y="630" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Putting a tool away</text><text x="850" y="654" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Let go of the grip at the tool&#x27;s place.</text><text x="850" y="674" font-size="12.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Elsewhere it floats on its line (Extended tool physics).</text><text x="40" y="822" font-size="14" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Left-handed (VR tab: Handedness): all places are mirrored. The dashed rings are where the hand reaches; they are larger than they look.</text></svg>
