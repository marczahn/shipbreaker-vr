<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="ShipbreakerVR menu controls"><rect width="1200" height="440" rx="12" fill="#11151b"/><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker></defs><text x="40" y="52" font-size="26" fill="#e6edf3" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Menus and keyboard</text><text x="40" y="78" font-size="14" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">In menus both controllers act as one Xbox gamepad, each button where its twin sits.</text><rect x="40" y="110" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,132)"><circle cx="38" cy="38" r="30" fill="#2f3945" stroke="#f0883e" stroke-width="2"/><circle cx="38" cy="38" r="12" fill="#3a4554"/><path d="M14 38 H2" stroke="#f0883e" stroke-width="3" fill="none" marker-end="url(#ah)"/><path d="M62 38 H74" stroke="#f0883e" stroke-width="3" fill="none" marker-end="url(#ah)"/><path d="M38 14 V2" stroke="#f0883e" stroke-width="3" fill="none" marker-end="url(#ah)"/><path d="M38 62 V74" stroke="#f0883e" stroke-width="3" fill="none" marker-end="url(#ah)"/></g><text x="150" y="152" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Left stick</text><text x="150" y="178" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Navigate.</text><text x="150" y="198" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Pressed: center the view.</text><rect x="630" y="110" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,132)"><circle cx="38" cy="38" r="30" fill="#2f3945" stroke="#f0883e" stroke-width="2"/><circle cx="38" cy="38" r="12" fill="#3a4554"/><path d="M38 14 V2" stroke="#f0883e" stroke-width="3" fill="none" marker-end="url(#ah)"/><path d="M38 62 V74" stroke="#f0883e" stroke-width="3" fill="none" marker-end="url(#ah)"/></g><text x="740" y="152" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Right stick</text><text x="740" y="178" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Scroll.</text><text x="740" y="198" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Pressed: R3 in menus, pause in gameplay.</text><rect x="40" y="250" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(60,272)"><circle cx="22" cy="44" r="15" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="22" y="50" font-size="15" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">B</text><circle cx="54" cy="28" r="15" fill="#2f3945" stroke="#f0883e" stroke-width="2.5"/><text x="54" y="34" font-size="15" fill="#e6edf3" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">A</text></g><text x="150" y="292" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">A / B</text><text x="150" y="318" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">A confirms, B goes back.</text><text x="150" y="338" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">X and Y are X and Y.</text><rect x="630" y="250" width="550" height="120" rx="12" fill="#1a2028" stroke="#2b333d"/><g transform="translate(650,272)"><rect x="23" y="14" width="30" height="48" rx="12" fill="#2f3945" stroke="#f0883e" stroke-width="2" transform="rotate(0 38 38)"/><path d="M30 30 Q22 38 30 48" stroke="#f0883e" stroke-width="4" fill="none"/><path d="M10 39 H22" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/></g><text x="740" y="292" font-size="18" fill="#f0883e" font-weight="bold" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Triggers</text><text x="740" y="318" font-size="13.5" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Switch tabs (the gamepad&#x27;s shoulder buttons).</text><text x="740" y="338" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The grips are the gamepad&#x27;s triggers.</text><text x="40" y="412" font-size="14" fill="#8b949e" font-weight="normal" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Keyboard: F3 VR on/off · F4 center view · F7 monitor look · F8 or B + Y debug dump · The left menu button stays with Virtual Desktop.</text></svg>
